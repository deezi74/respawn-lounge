<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <meta name="color-scheme" content="dark">
  <title>Respawn Lounge · Offline</title>
  <style>
    *{box-sizing:border-box}
    body{background:radial-gradient(ellipse at 15% 5%,#00e5ff0d,transparent 50%),radial-gradient(ellipse at 90% 90%,#a855f714,transparent 50%),#090b14;color:#f4f5ff;font-family:system-ui,sans-serif;margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px}
    main{padding:clamp(28px,6vw,44px);width:100%;max-width:490px;background:#121625;border:1px solid #a855f745;border-radius:24px;box-shadow:0 24px 80px #0006,0 0 45px #00e5ff08;position:relative;overflow:hidden}
    main::before{content:"";position:absolute;top:0;left:28px;right:28px;height:2px;background:linear-gradient(90deg,#00e5ff,#a855f7,#ff3da6)}
    img{width:72px;height:72px;display:block}
    h1{font-size:clamp(29px,6vw,36px);line-height:1.12;letter-spacing:-1.2px;margin:28px 0 18px}
    p{color:#b8bfd5;line-height:1.8;margin:0 0 28px}
    button{padding:14px 24px;background:#00e5ff;color:#090b14;border:1px solid #00e5ff;border-radius:10px;font:700 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 0 24px #00e5ff20;transition:background .15s,box-shadow .15s}
    button:hover{background:#7af2ff;box-shadow:0 0 28px #00e5ff38}
    button:focus-visible{outline:3px solid #b6ff3b;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img src="/brand/icon-192.png" alt="Respawn" width="72" height="72">
    <h1>A quick connection break.</h1>
    <p>Respawn Lounge needs a connection to load your videos, private clips, and community. Your saved moments are still on the server. Reconnect, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
